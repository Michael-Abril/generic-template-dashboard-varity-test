# Generic Template Dashboard - Production Docker Stack
# Optimized for production deployment with security and performance
#
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d
#
# Environment:
#   Copy .env.production.example to .env.production and configure
#
name: generic-template-dashboard-prod

services:
  # ==========================================================================
  # PostgreSQL Database - Production Configuration
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: generic-template-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-generic_template}
      POSTGRES_USER: ${POSTGRES_USER:-generic_template}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-generic_template} -d ${POSTGRES_DB:-generic_template}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - production-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    labels:
      - "com.docker.compose.project=generic-template-prod"
      - "varity.environment=production"
      - "varity.component=database"

  # ==========================================================================
  # Redis Cache - Production Configuration
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: generic-template-redis-prod
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data_prod:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - production-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    labels:
      - "com.docker.compose.project=generic-template-prod"
      - "varity.environment=production"
      - "varity.component=cache"

  # ==========================================================================
  # Ollama LLM - Production Configuration
  # ==========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: generic-template-ollama-prod
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama_data_prod:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MODELS=${OLLAMA_MODEL:-tinyllama}
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_NUM_PARALLEL=4
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 180s
    networks:
      - production-network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    labels:
      - "com.docker.compose.project=generic-template-prod"
      - "varity.environment=production"
      - "varity.component=llm"

  # ==========================================================================
  # Qdrant Vector Database - Production Configuration
  # ==========================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: generic-template-qdrant-prod
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6334}:6333"
      - "${QDRANT_GRPC_PORT:-6335}:6334"
    volumes:
      - qdrant_data_prod:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__STORAGE__STORAGE_PATH=/qdrant/storage
      - QDRANT__LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - production-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    labels:
      - "com.docker.compose.project=generic-template-prod"
      - "varity.environment=production"
      - "varity.component=vector-db"

  # ==========================================================================
  # Backend FastAPI - Production Configuration
  # ==========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: generic-template-backend-prod
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8002}:8000"
    environment:
      # Database
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-generic_template}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-generic_template}
      # Redis
      - REDIS_URL=redis://redis:6379
      # Ollama
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-tinyllama}
      # Qdrant
      - QDRANT_URL=http://qdrant:6333
      # Lit Protocol
      - LIT_NETWORK=${LIT_NETWORK:-cayenne}
      # Blockchain
      - BLOCKCHAIN_RPC_URL=${BLOCKCHAIN_RPC_URL}
      - VARITY_RPC_URL=${VARITY_RPC_URL:-https://rpc-varity-testnet-rroe52pwjp.t.conduit.xyz}
      # Service identification
      - SERVICE_NAME=generic-template-backend
      - TEMPLATE_TYPE=generic
      - ENVIRONMENT=production
      # Security
      - DEV_MODE=false
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      # OAuth
      - OAUTH_REDIRECT_BASE_URL=${OAUTH_REDIRECT_BASE_URL}
      # Storage
      - PINATA_API_KEY=${PINATA_API_KEY}
      - PINATA_SECRET_KEY=${PINATA_SECRET_KEY}
      # Notifications
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      # Stripe
      - STRIPE_API_KEY=${STRIPE_API_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - production-network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G
    # NO volume mount in production - use built image
    # NO --reload flag in production - handled by Dockerfile CMD
    labels:
      - "com.docker.compose.project=generic-template-prod"
      - "varity.environment=production"
      - "varity.component=api"

  # ==========================================================================
  # Frontend Next.js - Production Configuration
  # ==========================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8002}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8002}
        - NEXT_PUBLIC_PRIVY_APP_ID=${NEXT_PUBLIC_PRIVY_APP_ID}
        - NEXT_PUBLIC_THIRDWEB_CLIENT_ID=${NEXT_PUBLIC_THIRDWEB_CLIENT_ID}
        - NEXT_PUBLIC_VARITY_CHAIN_ID=${NEXT_PUBLIC_VARITY_CHAIN_ID:-33529}
        - NEXT_PUBLIC_VARITY_RPC_URL=${NEXT_PUBLIC_VARITY_RPC_URL:-https://rpc-varity-testnet-rroe52pwjp.t.conduit.xyz}
        - NEXT_PUBLIC_COMPANY_NAME=${NEXT_PUBLIC_COMPANY_NAME:-Generic Company}
        - NEXT_PUBLIC_COMPANY_INDUSTRY=${NEXT_PUBLIC_COMPANY_INDUSTRY:-generic}
        - NEXT_PUBLIC_ENABLE_ERROR_TRACKING=${NEXT_PUBLIC_ENABLE_ERROR_TRACKING:-true}
        - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
        - NEXT_PUBLIC_ENVIRONMENT=production
    container_name: generic-template-frontend-prod
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - production-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    labels:
      - "com.docker.compose.project=generic-template-prod"
      - "varity.environment=production"
      - "varity.component=frontend"

# ==========================================================================
# Named Volumes - Production Data Persistence
# ==========================================================================
volumes:
  postgres_data_prod:
    name: generic-template-postgres-data-prod
    labels:
      - "varity.environment=production"
      - "varity.component=database-storage"
      - "varity.backup=required"

  redis_data_prod:
    name: generic-template-redis-data-prod
    labels:
      - "varity.environment=production"
      - "varity.component=cache-storage"

  ollama_data_prod:
    name: generic-template-ollama-data-prod
    labels:
      - "varity.environment=production"
      - "varity.component=llm-storage"

  qdrant_data_prod:
    name: generic-template-qdrant-data-prod
    labels:
      - "varity.environment=production"
      - "varity.component=vector-storage"
      - "varity.backup=required"

# ==========================================================================
# Production Network
# ==========================================================================
networks:
  production-network:
    name: generic-template-network-prod
    driver: bridge
    labels:
      - "varity.environment=production"
      - "varity.network=isolated"
