name: Deploy to Varity L3 Testnet

# DISABLED FOR BETA DEPLOYMENT
# Using Railway + Vercel for beta testing instead of Akash/IPFS
# Re-enable for production DePin deployment

on:
  workflow_dispatch:  # Manual trigger only
  # push:
  #   branches: [main, testnet]
  # pull_request:
  #   branches: [main, testnet]

env:
  NODE_VERSION: '18'
  VARITY_ENV: testnet

jobs:
  # ===========================================================================
  # JOB 1: RUN TESTS
  # ===========================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Run frontend tests
        run: npm test
        env:
          CI: true

      - name: Build production bundle (test)
        run: npm run build
        env:
          NEXT_PUBLIC_VARITY_CHAIN_ID: 33529
          NEXT_PUBLIC_VARITY_RPC_URL: https://rpc-varity-testnet-rroe52pwjp.t.conduit.xyz

  # ===========================================================================
  # JOB 2: TEST SMART CONTRACTS
  # ===========================================================================
  test-contracts:
    name: Test Smart Contracts
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./contracts

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json

      - name: Install contract dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run contract tests
        run: npx hardhat test

      - name: Check contract coverage
        run: npx hardhat coverage
        continue-on-error: true

  # ===========================================================================
  # JOB 3: DEPLOY SMART CONTRACTS (MAIN BRANCH ONLY)
  # ===========================================================================
  deploy-contracts:
    name: Deploy Smart Contracts
    needs: [test, test-contracts]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./contracts

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Deploy to Varity L3 Testnet
        run: npx hardhat deploy --network varity-l3-testnet --tags all
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          VARITY_RPC_URL: https://rpc-varity-testnet-rroe52pwjp.t.conduit.xyz
          VARITY_CHAIN_ID: 33529

      - name: Verify contracts
        run: npx hardhat verify --network varity-l3-testnet
        continue-on-error: true
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v3
        with:
          name: contract-deployments
          path: contracts/deployments/varity-l3-testnet/

  # ===========================================================================
  # JOB 4: DEPLOY BACKEND (MAIN BRANCH ONLY)
  # ===========================================================================
  deploy-backend:
    name: Deploy Backend to Akash
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/varity-backend:latest
            ghcr.io/${{ github.repository_owner }}/varity-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Akash Network
        run: ./scripts/deploy-backend.sh
        env:
          DOCKER_REGISTRY: ghcr.io/${{ github.repository_owner }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VARITY_RPC_URL: https://rpc-varity-testnet-rroe52pwjp.t.conduit.xyz
          VARITY_CHAIN_ID: 33529
          VARITY_ENV: testnet
        continue-on-error: true

  # ===========================================================================
  # JOB 5: DEPLOY FRONTEND (MAIN BRANCH ONLY)
  # ===========================================================================
  deploy-frontend:
    name: Deploy Frontend to IPFS
    needs: [test, deploy-contracts]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_VARITY_CHAIN_ID: 33529
          NEXT_PUBLIC_VARITY_RPC_URL: https://rpc-varity-testnet-rroe52pwjp.t.conduit.xyz
          NEXT_PUBLIC_PRIVY_APP_ID: ${{ secrets.PRIVY_APP_ID }}
          NEXT_PUBLIC_THIRDWEB_CLIENT_ID: ${{ secrets.THIRDWEB_CLIENT_ID }}
          NEXT_PUBLIC_API_URL: ${{ secrets.API_URL }}

      - name: Deploy to IPFS via Pinata
        run: ./scripts/deploy-frontend.sh
        env:
          PINATA_API_KEY: ${{ secrets.PINATA_API_KEY }}
          PINATA_SECRET_KEY: ${{ secrets.PINATA_SECRET_KEY }}
          VARITY_ENV: testnet

      - name: Upload deployment info
        uses: actions/upload-artifact@v3
        with:
          name: frontend-deployment
          path: deployment-info.json

  # ===========================================================================
  # JOB 6: HEALTH CHECKS (AFTER DEPLOYMENT)
  # ===========================================================================
  health-check:
    name: Run Health Checks
    needs: [deploy-contracts, deploy-backend, deploy-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download frontend deployment info
        uses: actions/download-artifact@v3
        with:
          name: frontend-deployment

      - name: Download contract deployment artifacts
        uses: actions/download-artifact@v3
        with:
          name: contract-deployments
          path: contracts/deployments/varity-l3-testnet/

      - name: Run health checks
        run: ./scripts/health-check.sh
        env:
          VARITY_RPC_URL: https://rpc-varity-testnet-rroe52pwjp.t.conduit.xyz
        continue-on-error: true

      - name: Post deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** testnet" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "deployment-info.json" ]; then
            echo "**Frontend IPFS Hash:** $(cat deployment-info.json | grep -o '"ipfsHash":"[^"]*' | cut -d'"' -f4)" >> $GITHUB_STEP_SUMMARY
            echo "**Frontend URL:** $(cat deployment-info.json | grep -o '"pinataGateway":"[^"]*' | cut -d'"' -f4)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployment Complete!" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # JOB 7: NOTIFY ON DEPLOYMENT FAILURE
  # ===========================================================================
  notify-failure:
    name: Notify on Failure
    needs: [deploy-contracts, deploy-backend, deploy-frontend, health-check]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Send failure notification
        run: |
          echo "❌ Deployment to Varity L3 Testnet failed"
          echo "Check the GitHub Actions logs for details"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
