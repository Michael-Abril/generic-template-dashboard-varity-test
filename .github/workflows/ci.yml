name: CI - Test & Lint

# DISABLED FOR BETA DEPLOYMENT
# These workflows require GitHub Secrets that aren't configured yet.
# Re-enable after setting up:
# - PINATA_API_KEY, PINATA_SECRET_KEY
# - DEPLOYER_PRIVATE_KEY
# - PRIVY_APP_ID, THIRDWEB_CLIENT_ID

on:
  workflow_dispatch:  # Manual trigger only
  # push:
  #   branches: [main, develop, feature/*]
  # pull_request:
  #   branches: [main, develop]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  # ===========================================================================
  # JOB 1: FRONTEND TESTS
  # ===========================================================================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Run frontend tests
        run: npm test -- --passWithNoTests
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_VARITY_CHAIN_ID: 33529
          NEXT_PUBLIC_VARITY_RPC_URL: https://rpc-varity-testnet-rroe52pwjp.t.conduit.xyz
          NEXT_PUBLIC_PRIVY_APP_ID: test-app-id
          NEXT_PUBLIC_THIRDWEB_CLIENT_ID: test-client-id
          NEXT_PUBLIC_API_URL: http://localhost:8002

  # ===========================================================================
  # JOB 2: BACKEND TESTS (Python)
  # ===========================================================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Python linting
        run: |
          pip install flake8
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

      - name: Run type checking
        run: |
          pip install mypy
          mypy app/ --ignore-missing-imports --no-error-summary
        continue-on-error: true

      - name: Run backend tests
        run: pytest tests/ -v --tb=short -x
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          VARITY_RPC_URL: https://rpc-varity-testnet-rroe52pwjp.t.conduit.xyz
          VARITY_CHAIN_ID: 33529
          SECRET_KEY: test-secret-key-for-ci
          PINATA_API_KEY: test-pinata-key
          PINATA_SECRET_KEY: test-pinata-secret
          ENVIRONMENT: test
        continue-on-error: true

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short -m integration
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          VARITY_RPC_URL: https://rpc-varity-testnet-rroe52pwjp.t.conduit.xyz
          VARITY_CHAIN_ID: 33529
          SECRET_KEY: test-secret-key-for-ci
          ENVIRONMENT: test
        continue-on-error: true

  # ===========================================================================
  # JOB 3: SMART CONTRACT TESTS
  # ===========================================================================
  contract-test:
    name: Smart Contract Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./contracts

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json

      - name: Install contract dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run contract tests
        run: npx hardhat test

      - name: Run Solidity linting
        run: npx solhint 'src/**/*.sol'
        continue-on-error: true

  # ===========================================================================
  # JOB 4: SECURITY SCAN
  # ===========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Python security scan
        run: |
          pip install safety bandit
          safety check -r backend/requirements.txt || true
          bandit -r backend/app/ -ll || true
        continue-on-error: true

  # ===========================================================================
  # JOB 5: CI SUMMARY
  # ===========================================================================
  ci-summary:
    name: CI Summary
    needs: [frontend-test, backend-test, contract-test, security-scan]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check job statuses
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Tests | ${{ needs.frontend-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests | ${{ needs.backend-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Contract Tests | ${{ needs.contract-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.frontend-test.result }}" == "success" && "${{ needs.contract-test.result }}" == "success" ]]; then
            echo "✅ **All required checks passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some checks failed. Please review the logs.**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if critical jobs failed
        if: needs.frontend-test.result == 'failure' || needs.contract-test.result == 'failure'
        run: exit 1
