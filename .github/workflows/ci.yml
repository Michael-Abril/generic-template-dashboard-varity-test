# Varity Dashboard CI Pipeline
# Prevents broken code from reaching production
# Last Updated: December 29, 2025

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # Job 1: Build and TypeScript Check
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify package-lock.json exists
        run: |
          if [ ! -f "package-lock.json" ]; then
            echo "ERROR: package-lock.json not found after checkout!"
            ls -la
            exit 1
          fi
          echo "package-lock.json found ($(wc -l < package-lock.json) lines)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run TypeScript type check
        run: npm run type-check

      # NOTE: ESLint 9.x is not compatible with next lint
      # Linting is handled by pre-commit hooks instead
      # See: https://nextjs.org/docs/app/api-reference/config/eslint

      - name: Build application
        run: npm run build
        env:
          # Required env vars for build (same as Vercel production)
          NEXT_PUBLIC_API_URL: https://generic-template-dashboard-production.up.railway.app
          NEXT_PUBLIC_PRIVY_APP_ID: cmhwbozxu004fjr0cicfz0tf8
          NEXT_PUBLIC_THIRDWEB_CLIENT_ID: acb17e07e34ab2b8317aa40cbb1b5e1d

  # Job 2: API Health Check (runs in parallel)
  api-health:
    name: API Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Check Backend Health
        run: |
          echo "Checking backend health..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://generic-template-dashboard-production.up.railway.app/health)
          if [ "$response" != "200" ]; then
            echo "Backend health check failed with status: $response"
            exit 1
          fi
          echo "Backend is healthy!"

      - name: Check AI Service Health
        run: |
          echo "Checking AI service health..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://generic-template-dashboard-production.up.railway.app/api/v1/ai/health)
          if [ "$response" != "200" ]; then
            echo "AI service health check failed with status: $response"
            exit 1
          fi
          echo "AI service is healthy!"

  # Job 3: E2E Tests with Playwright (non-blocking - tests need updating)
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true  # E2E tests are informational only until test suite is updated

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify package-lock.json exists
        run: |
          if [ ! -f "package-lock.json" ]; then
            echo "ERROR: package-lock.json not found after checkout!"
            ls -la
            exit 1
          fi
          echo "package-lock.json found ($(wc -l < package-lock.json) lines)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: https://app.varity.so

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Summary job - blocks merge if critical jobs fail
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [build, api-health]  # E2E tests are non-blocking until updated

    steps:
      - name: All checks passed
        run: echo "All CI checks passed! Safe to merge."
