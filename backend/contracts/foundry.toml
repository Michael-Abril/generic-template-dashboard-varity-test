# Foundry Configuration for Varity Smart Contracts
# https://book.getfoundry.sh/reference/config/

[profile.default]
src = "."
out = "out"
libs = ["lib"]
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "paris"

# Auto-detect remappings
auto_detect_remappings = true

# Contract size limit (24KB)
bytecode_hash = "ipfs"

# Build
build_info = true
extra_output = ["abi", "evm.bytecode"]
extra_output_files = ["abi"]

# Testing
fuzz = { runs = 256 }
invariant = { runs = 256 }

# Gas reporting
gas_reports = ["VarityDataCommitments"]

# Varity L3 Testnet (Arbitrum Stack via Conduit - AnyTrust)
[rpc_endpoints]
varity_testnet = "https://rpc-varity-testnet-rroe52pwjp.t.conduit.xyz"
arbitrum_sepolia = "https://sepolia-rollup.arbitrum.io/rpc"
localhost = "http://127.0.0.1:8545"

# Etherscan API configuration for verification
# Note: Conduit explorer may require custom API endpoint
[etherscan]
varity_testnet = { key = "${ETHERSCAN_API_KEY}", url = "https://explorer-varity-testnet-rroe52pwjp.t.conduit.xyz/api" }

# Deployment profiles
[profile.varity_testnet]
optimizer = true
optimizer_runs = 1000
evm_version = "paris"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "all"
quote_style = "double"
number_underscore = "thousands"
